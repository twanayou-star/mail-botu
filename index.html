<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Otomasyon Kodu</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 100px; background: #f4f4f9; }
        .container { background: white; padding: 40px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        #result { margin-top: 20px; font-size: 24px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gelen Kodu Al</h2>
        <button onclick="koduGetir()">Kodu Çek</button>
        <div id="result">---</div>
    </div>

    <script>
        function koduGetir() {
            document.getElementById('result').innerText = "Mail kontrol ediliyor...";
            fetch('/get-code')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerText = data.code;
                })
                .catch(error => {
                    document.getElementById('result').innerText = "Bir hata oluştu.";
                });
        }
    </script>
</body>
</html>
